services:
  # Serviço web do Strapi
  - type: web
    name: personal-blog-strapi
    runtime: node
    plan: starter #
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /_health
    envVars:
      - key: DATABASE_CLIENT
        value: postgres

      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
